name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Boot smoke test
        run: |
          node server.js &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8890/healthz && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8890/ | grep -q WasGibts
          curl -fsS http://127.0.0.1:8890/shared/sample-menu.json > /dev/null
